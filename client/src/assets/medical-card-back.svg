<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 638" width="1012" height="638" role="img" aria-label="Sample insurance card, back">
  <defs>
    <clipPath id="b-card"><rect x="0" y="0" width="1012" height="638" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#b-card)" font-family="Helvetica, Arial, sans-serif">
    <rect width="1012" height="638" fill="#ffffff"/>
    <rect width="1012" height="112" fill="#1e293b"/>
    <text x="48" y="68" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="3">IMPORTANT INFORMATION</text>
    <text x="972" y="66" font-size="22" fill="#cbd5e1" text-anchor="end">NORTHWIND MUTUAL HEALTH</text>
    <rect x="0" y="112" width="1012" height="62" fill="#334155"/>

    <g font-size="20" font-weight="bold" fill="#64748b" letter-spacing="2">
      <text x="48" y="232">MEMBER SERVICES</text>
      <text x="48" y="330">PHARMACY HELP DESK</text>
      <text x="48" y="428">NURSE LINE &#8212; 24/7</text>
      <text x="560" y="232">SEND CLAIMS TO</text>
      <text x="560" y="400">PROVIDERS</text>
    </g>
    <g font-size="34" font-weight="bold" fill="#0f172a">
      <text x="48" y="272">(555) 018-2400</text>
      <text x="48" y="370">(555) 018-2410</text>
      <text x="48" y="468">(555) 018-2420</text>
    </g>
    <g font-size="24" fill="#334155">
      <text x="560" y="272">Northwind Mutual Health</text>
      <text x="560" y="304">PO Box 1000</text>
      <text x="560" y="336">Springfield, ST 00000</text>
      <text x="560" y="440">Verify eligibility at</text>
      <text x="560" y="472">portal.northwind.example</text>
    </g>

    <rect x="40" y="520" width="932" height="70" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
    <text x="72" y="552" font-size="19" fill="#475569">This card does not guarantee coverage. Possession does not verify eligibility.</text>
    <text x="72" y="578" font-size="19" fill="#94a3b8">Sample card for app demonstration only &#8212; not a real plan, insurer, or person.</text>
  </g>

  <rect x="1" y="1" width="1010" height="636" rx="34" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>
