<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 638" width="1012" height="638" role="img" aria-label="Sample dental insurance card, back">
  <defs>
    <clipPath id="db-card"><rect x="0" y="0" width="1012" height="638" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#db-card)" font-family="Helvetica, Arial, sans-serif">
    <rect width="1012" height="638" fill="#ffffff"/>
    <rect width="1012" height="112" fill="#134e4a"/>
    <text x="48" y="68" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="3">IMPORTANT INFORMATION</text>
    <text x="972" y="66" font-size="22" fill="#99f6e4" text-anchor="end">SILVERPINE DENTAL GUILD</text>
    <rect x="0" y="112" width="1012" height="62" fill="#115e59"/>
    <rect x="846" y="126" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <text x="909" y="150" font-size="19" font-weight="bold" fill="#ffffff" letter-spacing="3" text-anchor="middle">SAMPLE</text>

    <g font-size="20" font-weight="bold" fill="#64748b" letter-spacing="2">
      <text x="48" y="232">MEMBER SERVICES</text>
      <text x="48" y="330">PRE-TREATMENT ESTIMATES</text>
      <text x="48" y="428">FIND A DENTIST</text>
      <text x="560" y="232">SEND CLAIMS TO</text>
      <text x="560" y="400">PROVIDERS</text>
    </g>
    <g font-size="34" font-weight="bold" fill="#0f172a">
      <text x="48" y="272">(555) 019-3300</text>
      <text x="48" y="370">(555) 019-3310</text>
      <text x="48" y="468">(555) 019-3320</text>
    </g>
    <g font-size="24" fill="#334155">
      <text x="560" y="272">Silverpine Dental Guild</text>
      <text x="560" y="304">PO Box 2200</text>
      <text x="560" y="336">Springfield, ST 00000</text>
      <text x="560" y="440">Verify eligibility at</text>
      <text x="560" y="472">portal.silverpine.example</text>
    </g>

    <rect x="40" y="520" width="932" height="70" rx="14" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="2"/>
    <text x="72" y="552" font-size="19" fill="#475569">This card does not guarantee coverage. Possession does not verify eligibility.</text>
    <text x="72" y="578" font-size="19" fill="#94a3b8">Sample card for app demonstration only &#8212; not a real plan, insurer, or person.</text>
  </g>

  <rect x="1" y="1" width="1010" height="636" rx="34" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>
